name: Hosted mathematics

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'verification/hosted/**'
      - '.github/workflows/hosted-math.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated capture dependencies
        run: npm install --prefix "$RUNNER_TEMP/hosted-math-deps" playwright@1.56.1 mathjax-full@3.2.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/hosted-math-deps/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compare actual GitHub mathematics with the source
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/hosted-math-deps/node_modules"
          node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$SOURCE_REPOSITORY" \
            --revision "$SOURCE_REVISION" \
            --contract verification/hosted/math-contract.json \
            --output "$RUNNER_TEMP/hosted-math-evidence"
      - name: Retain reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hosted-math-evidence
          if-no-files-found: warn
          retention-days: 14
